name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # No ANTHROPIC_API_KEY is set: the suite must pass without ever
        # reaching the network.
        run: pytest -q

      - name: Smoke test the CLI end to end
        env:
          CODEREVIEW_OFFLINE: '1'
        run: |
          codereview eval --offline --limit 2 --configs selective
