# Config for the synthetic repository used by `codereview eval`.
# The harness overrides `agents` and `context.mode` per evaluated configuration.
version: 1

model: claude-opus-5
max_tokens: 16000

agents:
  - security
  - correctness
  - patterns
  - requirements

context:
  mode: selective
  max_chunks: 12
  max_chunk_chars: 1800
  max_rules: 6

review:
  min_confidence: 0.5
  max_findings: 15
  require_changed_lines: true
  changed_line_slack: 3
  fail_on: high
  history: false

rules_dir: .review/rules
